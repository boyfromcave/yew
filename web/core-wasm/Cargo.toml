# yew-web-core: the wasm-bindgen binding over yew-core for the browser shell (plan §1).
# Built with `wasm-pack build --target web` by web/scripts/build-core-wasm.sh; kept out of the
# root workspace because its dependency graph (tonic-web-wasm-client, sqlite-wasm-rs) only
# resolves for wasm32-unknown-unknown. W0 makes `yew-core = { path = "../../core", features = ["wasm"] }`
# compile; until then the crate exposes `status()` only.
[package]
name = "yew-web-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
# W0 (plan §2), gated behind the `core` feature until yew-core builds for wasm32:
# yew-core = { path = "../../core", default-features = false, features = ["wasm"], optional = true }
# tonic-web-wasm-client = "0.7"
# getrandom = { version = "0.2", features = ["js"] }

[features]
default = []
core = []   # W0: ["dep:yew-core"]

[profile.release]
opt-level = "s"
lto = true
