# yew-web-core: the wasm-bindgen binding over yew-core for the browser shell (plan §1).
# Built with `wasm-pack build --target web` by web/scripts/build-core-wasm.sh; kept out of the
# root workspace because its dependency graph (tonic-web-wasm-client, sqlite-wasm-rs) only
# resolves for wasm32-unknown-unknown. yew-core compiles for wasm32 since W0.4 (no cargo feature:
# its per-target tables and `cfg(target_arch = "wasm32")` do the job; see web/spike-net for the
# channel in headless Chrome); the binding over it lands with W0.2/W0.3 — until then the crate
# exposes `status()` only.
[package]
name = "yew-web-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
# W0 (plan §2), gated behind the `core` feature until yew-core builds for wasm32:
# yew-core = { path = "../../core", optional = true }   # plus the root's [patch] tables

[features]
default = []
core = []   # W0: ["dep:yew-core"]

[profile.release]
opt-level = "s"
lto = true
