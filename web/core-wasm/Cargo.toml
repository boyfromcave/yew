# yew-web-core: the wasm-bindgen binding over yew-core for the browser shell (plan §1).
# Built with `wasm-pack build --target web` by web/scripts/build-core-wasm.sh; kept out of the
# root workspace because its dependency graph (tonic-web-wasm-client, sqlite-wasm-rs) only
# resolves for wasm32-unknown-unknown. yew-core compiles for wasm32 since W0.4 (no cargo
# feature: its per-target tables and `cfg(target_arch = "wasm32")` do the job); since W0.5 the
# crate binds the real core (storage on OPFS, the private sync, balances, the address) and
# web/scripts/test-core-wasm.sh runs it end to end against a lightwalletd gateway in headless Chrome.
[package]
name = "yew-web-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
yew-core = { path = "../../core" }
# The versions yew-core's wasm32 table pins (one copy of each in the graph).
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# The test imports a foreign key (W1a); the version yew-core pins.
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std"] }
web-sys = { version = "=0.3.105", features = ["WorkerGlobalScope", "Response"] }
# tests/harden.rs (W3) reaches the sahpool's management handle (capacity, the file list): the
# versions the light library pins (one copy in the graph).
sqlite-wasm-rs = { version = "=0.5.5", default-features = false }
sqlite-wasm-vfs = { version = "=0.2.0", default-features = false }

[profile.release]
opt-level = "s"
lto = true

# As the root manifest: dependencies optimised in dev builds too (trial decryption, the shard
# tree and SQLite at opt-level 0 overrun the test runner's timeout; proving takes minutes).
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# As in the root Cargo.toml (patches do not propagate through dependencies).
[patch.crates-io]
schemerz-rusqlite = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "774de4e5f904ce89ae850c7100082af64a1e31e1" }
# tonic-web-wasm-client 0.9.2 answers "malformed response" to a Trailers-Only gRPC-web reply
# (grpc-status in the HTTP headers, empty body) — what Envoy Gateway sends for an empty server
# stream (the kind cluster's yindex `GetTaddressTxids` for an address with no history) — so the
# transparent sync never completed in the browser (yew/web plan W1a). Upstream issue #99; the fix
# is PR #113 ("end the body when the stream ends between frames"), open, pinned here at its head
# until it is released. Same rev in web/core-wasm/Cargo.toml.
tonic-web-wasm-client = { git = "https://github.com/QuantumExplorer/tonic-web-wasm-client.git", rev = "cf9abc3952405cd61d7deacf906ff9e1dd8515ea" }

