# W0.4 spike (yew/web plan §2): yew-core's network layer on wasm32-unknown-unknown — the gRPC-web
# channel `net::Server::connect` builds in the browser, and a `GetLightdInfo` over it from
# headless Chrome (no server listens: the request must be attempted and come back as an error).
# Not a workspace member (its graph resolves for wasm32 only; same patch tables as the root).
[package]
name = "spike-net"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
yew-core = { path = "../../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# The yew-core dependencies keep the root's optimisation split (sapling proving is slow at -O0).
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# LOCAL PATHS, as in the root Cargo.toml (patches do not propagate through dependencies).
[patch.crates-io]
schemerz-rusqlite = { path = "../../../librustzcash6-web/components/schemerz-rusqlite" }

[patch."https://github.com/boyfromcave/librustzcash6.git"]
zcash_protocol = { path = "../../../librustzcash6-web/components/zcash_protocol" }
zcash_primitives = { path = "../../../librustzcash6-web/zcash_primitives" }
f4jumble = { path = "../../../librustzcash6-web/components/f4jumble" }
zcash_address = { path = "../../../librustzcash6-web/components/zcash_address" }
zcash_encoding = { path = "../../../librustzcash6-web/components/zcash_encoding" }
zcash_transparent = { path = "../../../librustzcash6-web/zcash_transparent" }
zcash_client_backend = { path = "../../../librustzcash6-web/zcash_client_backend" }
zcash_client_sqlite = { path = "../../../librustzcash6-web/zcash_client_sqlite" }
zcash_keys = { path = "../../../librustzcash6-web/zcash_keys" }
zcash_proofs = { path = "../../../librustzcash6-web/zcash_proofs" }
zip321 = { path = "../../../librustzcash6-web/components/zip321" }

[patch."https://github.com/boyfromcave/x402-ycash.git"]
x402-ycash-light = { path = "../../../x402-w04/light" }
