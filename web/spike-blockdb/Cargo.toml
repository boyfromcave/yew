# W0.2 spike (yew/web plan §2, §5): the compact-block cache on OPFS. `zcash_client_sqlite::BlockDb`
# (the SQLite block source) on the sahpool VFS, and `scan_cached_blocks` over it against a WalletDb
# on OPFS, in headless Chrome. Not a workspace member.
[package]
name = "spike-blockdb"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
zcash_client_sqlite = { path = "../../../librustzcash6-web/zcash_client_sqlite", default-features = false }
zcash_client_backend = { path = "../../../librustzcash6-web/zcash_client_backend", default-features = false }
zcash_keys = { path = "../../../librustzcash6-web/zcash_keys", features = ["sapling"] }
zcash_primitives = { path = "../../../librustzcash6-web/zcash_primitives", default-features = false }
zcash_protocol = { path = "../../../librustzcash6-web/components/zcash_protocol", features = ["local-consensus"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }
zcash_note_encryption = "0.4"
zip32 = "0.2"
prost = "0.14"
rayon = "1"
secrecy = "0.8"
rusqlite = { version = "0.39", default-features = false }
sqlite-wasm-rs = { version = "0.5", default-features = false }
sqlite-wasm-vfs = { version = "0.2", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[patch.crates-io]
schemerz-rusqlite = { path = "../../../librustzcash6-web/components/schemerz-rusqlite" }

# As the yew root manifest does for its own crates: trial decryption, the shard tree and SQLite at
# opt-level 0 overrun wasm-bindgen-test's per-test timeout; keep the dependencies optimised in the
# debug build too.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# ...except the VFS: its "DB closed without open" debug assertion is the one-connection-per-file
# check (W0.1 finding 3), and the debug run must keep proving the cache honours it.
[profile.dev.package.sqlite-wasm-vfs]
debug-assertions = true
