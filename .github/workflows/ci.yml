# YEW CI (plan §6.4; workspace CI/CD design 2026-10-06). The bridge and the proto pin are
# verified, not trusted (docs/release.md §1). iOS signing is never done in CI.
#
# Push / PR tier (every push and pull request on the branches below), four parallel jobs:
#   core-linux   fmt, clippy (-D warnings), cargo test; the proto pin against lightwalletd-dd at the
#                commit proto/PIN records; the node vectors (core/tests/vectors/) against ycash-dd
#                and ycash6 at the commits core/tests/vectors/PIN records (fails, never skips); the
#                dependency allow-list; the licence listing
#   audit        cargo audit (W5; blocks only on advisories with a fix, scripts/audit.sh)
#   core-macos   clippy and cargo test on macOS (the platform code paths); the iOS core build
#   app          Flutter analyze / test; the app import and trust-text checks; the bridge is
#                regenerated and must equal the committed one
#   web          yew/web (plan W3): the import rule, vitest, then web/scripts/build-release.sh
#                — the wasm module and the Vite bundle each built twice and compared file by file
#                (fails on non-determinism), tsc once the module exists, BUNDLE-SHA256SUMS written — and verify-bundle.sh
#                against the built dist served locally (the sums and the SRI attributes).
#                librustzcash6 and x402-ycash come by git rev (their `up/web` branches), as
#                in the root manifest.
#   yewd-*       yew/yewd (the wallet-RPC façade, docs/plans/yewd-plan.md; workspace kogany plan §5,
#                docs/plans/kogany/ci-design.md): yewd-check (check-yewd.sh: naming and attribution
#                greps, fmt, clippy, cargo test; blocking), yewd-bin (the yewd-bin artifact),
#                yewd-node (ycashd from a trusted ycash6 run at the commit yewd/PIN records) and
#                yewd-gates (the S0 round trip and the S1-S3 stage gates, one job each, report-only
#                until each stage's gate is seen green).
#   kogany       (report-only; a push to or a dispatch on vaults/kogany-compat) scripts/kogany-leg.sh:
#                the W1 devnet acceptance (core/tests/devnet.rs) through lightwalletd-dd in front of
#                a regtest kogany node (the third node line, workspace kogany plan W9-c), its ycash6
#                test rig standing in for the devnet tool. zakurad is kogany's zakurad-bin artifact
#                at KOGANY_REF, else built at that commit; ycashd is ycash6's node-bin at
#                YCASH6_REF; lightwalletd-dd is built at proto/PIN.
# Not in this workflow: the devnet acceptance suites (scripts/devnet-*.sh). They need a workspace
# devnet (an ARMED devnet from ycash-dd, the attest agent, lightwalletd-dd serving --yellowback,
# the Python test framework), so they run nightly, non-gating, in devnet-nightly.yml: its `hosted`
# job on a GitHub-hosted runner (ycashd from the node's CI artifact, at most 60 min), its
# `self-hosted` job on the owner's machine by manual dispatch (SECURITY-CI.md, "Devnet tiers").
#
# Third-party actions are pinned by commit, never by tag; the comment carries the tag (bump both).
name: ci

on:
  push:
    # The one branch list: harden/yellowback (P1 hardening), upgrade/vault (the network upgrade),
    # upgrade/vault-in-term (in-term claims, rpcversion 6), upgrade/quantum-vaults (post-quantum owners,
    # rpcversion 7; proto/PIN names lightwalletd-dd's upgrade/quantum-vaults commit, so lightwalletd-dd
    # is pushed first), main (the branch of record, AGENTS.md rule 2).
    branches: &branches [main, harden/yellowback, upgrade/vault, upgrade/vault-in-term, upgrade/quantum-vaults, vaults/kogany-compat]
  pull_request:
    branches: *branches
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_AUDIT_VERSION: 0.22.2
  HOMEBREW_NO_AUTO_UPDATE: 1
  # upgrade/vault: the Sapling crates are git dependencies at pinned revisions (core/Cargo.toml:
  # boyfromcave/librustzcash6 @ 4867cf85, boyfromcave/x402-ycash light @ 8daa6fb); cargo fetches
  # them and rust-cache keeps ~/.cargo/git keyed on Cargo.lock. No sibling checkouts but
  # lightwalletd-dd for the proto pin.

jobs:
  core-linux:
    name: core (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # scripts/check-proto-pin.sh diffs proto/ against ../lightwalletd-dd/walletrpc: check it out
      # at the commit proto/PIN records (without it the check skips itself). actions/checkout
      # cannot write outside the workspace, so a plain clone puts it there.
      - name: clone lightwalletd-dd beside the repo at the proto pin
        run: |
          git clone --quiet --filter=blob:none https://github.com/boyfromcave/lightwalletd.git "$GITHUB_WORKSPACE/../lightwalletd-dd"
          git -C "$GITHUB_WORKSPACE/../lightwalletd-dd" checkout --quiet "$(awk '{print $2}' proto/PIN)"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler && protoc --version
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      # Keyed by rust-cache on rustc, Cargo.lock/Cargo.toml and the job; saved from pushes only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --all -- --check
      - run: scripts/check-proto-pin.sh
      # The node's golden vectors, fetched at core/tests/vectors/PIN from both node lines and
      # compared byte for byte with the copies the tests replay. No skip path: a failed fetch fails.
      - run: scripts/check-node-vectors.sh
      - run: scripts/check-deps.sh
      - run: scripts/check-licenses.sh
      # The Sapling parameters the core's hybrid tests prove with (hybrid_vectors*, build::pq_send,
      # build::sapling_pq), fetched and checked against the sums ycash6's zcutil/fetch-params.sh
      # pins (the app-devnet job's steps). No skip path: a missing or mismatched file fails the job,
      # and the tests read YEW_SAPLING_PARAMS and fail loudly without the files.
      - name: cache zcash params
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.zcash-params
          key: zcash-params-8e48ffd2-2f0ebbcb-b685d700
      - name: fetch and verify zcash params
        run: scripts/fetch-zcash-params.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: YEW_SAPLING_PARAMS="$HOME/.zcash-params" cargo test --workspace --locked

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      # cargo-audit at an exact version, cached by exact key (no restore-keys).
      - name: cache cargo-audit
        id: tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: install cargo-audit
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      # Reads Cargo.lock only.
      - run: scripts/audit.sh

  core-macos:
    name: core (macos)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install protoc
        run: brew install protobuf && protoc --version
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # The Sapling parameters the core's hybrid tests prove with (hybrid_vectors*, build::pq_send,
      # build::sapling_pq), fetched and checked against the sums ycash6's zcutil/fetch-params.sh
      # pins (the app-devnet job's steps). No skip path: a missing or mismatched file fails the job,
      # and the tests read YEW_SAPLING_PARAMS and fail loudly without the files.
      - name: cache zcash params
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.zcash-params
          key: zcash-params-8e48ffd2-2f0ebbcb-b685d700
      - name: fetch and verify zcash params
        run: scripts/fetch-zcash-params.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: YEW_SAPLING_PARAMS="$HOME/.zcash-params" cargo test --workspace --locked
      - name: iOS core build (unsigned, no xcframework signing)
        run: scripts/build-core-ios.sh

  app:
    name: app (macos)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: versions (Flutter from README.md, the bridge codegen from core/Cargo.toml)
        id: v
        run: |
          # shellcheck disable=SC2016 # the backticks are literal Markdown in the sed pattern
          echo "flutter=$(sed -n 's/^| Flutter *| `\([0-9.]*\)`.*/\1/p' README.md | head -1)" >> "$GITHUB_OUTPUT"
          echo "frb=$(sed -n 's/^flutter_rust_bridge = "=\(.*\)"/\1/p' core/Cargo.toml)" >> "$GITHUB_OUTPUT"
      # The SDK and the pub cache, keyed by the action on OS, channel, version, arch and pubspec.lock.
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: ${{ steps.v.outputs.flutter }}
          cache: true
      - name: flutter analyze / test
        working-directory: app
        run: |
          flutter --version
          flutter pub get
          flutter analyze
          flutter test
      - run: scripts/check-app-imports.sh
      - run: scripts/check-trust-text.sh
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      # The bridge regeneration builds the core crate, whose x402-ycash-light dependency compiles
      # its protos in build.rs (as core-macos does).
      - name: Install protoc
        run: brew install protobuf && protoc --version
      # The codegen at the crate's exact version, cached by exact key (no restore-keys): a hit
      # skips a ~6 min source build.
      - name: cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ runner.os }}-${{ runner.arch }}-${{ steps.v.outputs.frb }}
      - name: install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        env:
          FRB_VERSION: ${{ steps.v.outputs.frb }}
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
      - name: bridge is up to date (regenerate and diff)
        run: |
          scripts/gen-bridge.sh
          git diff --exit-code -- core/src/frb_generated.rs app/lib/src/rust

  # yewd (yew/yewd, docs/plans/yewd-plan.md; workspace kogany plan §3b, §5 "yewd's CI"; the job map
  # is the workspace's docs/plans/kogany/ci-design.md). Four jobs, each re-run on its own:
  #   yewd-check  (blocking) check-yewd.sh: naming and attribution greps, fmt, clippy, cargo test
  #   yewd-bin    the yewd-bin artifact: yewd and yewd-signer (dev profile) for this run's gates and
  #               for ycash6's mixed tier, which takes it at a pinned yew commit (30 days)
  #   yewd-node   ycashd and ycash-cli from ycash6's node-bin at the commit yewd/PIN records (a
  #               push, schedule or dispatch run), re-uploaded as this run's yewd-node artifact so
  #               a gate re-run never depends on ycash6's retention
  #   yewd-gates  one job per stage gate (the S0 backend round trip, S1, S2, the S3 stages that need
  #               no attestation agent), each on ycash6's functional framework at the PIN commit;
  #               report-only until its stage's gate is seen green, then `blocking: true`
  yewd-check:
    name: yewd check (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # protoc: x402-ycash-light's build.rs (yew-core, which yewd-wallet links by path).
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler && protoc --version
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: yewd
          save-if: ${{ github.event_name != 'pull_request' }}
      # The Sapling parameters the wallet tests' shielded sends prove with (held_yed's
      # z_sendmany to a Sapling address; yewd's default -paramsdir ~/.zcash-params), checked
      # against the sums ycash6's zcutil/fetch-params.sh pins. Restore only: the core jobs save
      # the cache. No skip path: a missing or mismatched file fails the job.
      - name: restore zcash params
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.zcash-params
          key: zcash-params-8e48ffd2-2f0ebbcb-b685d700
      - name: fetch and verify zcash params
        run: scripts/fetch-zcash-params.sh
      # Its own Cargo workspace, so the root workspace's jobs are unchanged.
      - run: yewd/scripts/check-yewd.sh

  yewd-bin:
    name: yewd bin (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler && protoc --version
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: yewd
          key: bin
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build yewd and yewd-signer (dev profile) and pack yewd-bin
        env:
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          cargo build --locked --manifest-path yewd/Cargo.toml --bins
          mkdir -p "$RUNNER_TEMP/pack"
          cp yewd/target/debug/yewd yewd/target/debug/yewd-signer "$RUNNER_TEMP/pack/"
          python3 - "$RUNNER_TEMP/pack/yewd-bin.json" "$REPO" "$COMMIT" "$(rustc --version)" <<'PY'
          import json, sys
          path, repo, commit, rustc = sys.argv[1:]
          json.dump({'repository': repo, 'commit': commit, 'binaries': ['yewd', 'yewd-signer'], 'profile': 'dev',
                     'runner': 'ubuntu-24.04', 'rustc': rustc, 'producer': 'yew ci.yml yewd-bin'},
                    open(path, 'w'), indent=1)
          PY
          tar czf "$RUNNER_TEMP/yewd-bin.tgz" -C "$RUNNER_TEMP/pack" yewd yewd-signer yewd-bin.json
          "$RUNNER_TEMP/pack/yewd" -version || "$RUNNER_TEMP/pack/yewd" --help | head -n 3 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # 30 days outside pull requests (the artifact contract ycash6's mixed tier consumes at a
        # pinned yew commit); a pull request run's copy is never trusted across repositories.
        with:
          name: yewd-bin
          path: ${{ runner.temp }}/yewd-bin.tgz
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
          if-no-files-found: error

  yewd-node:
    name: yewd node (ycash6 at yewd/PIN)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # gh run list/download on ycash6's runs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: yewd/PIN
          sparse-checkout-cone-mode: false
      # ycash6 keeps node-bin 30 days outside pull requests, and refreshes a branch tip's nightly
      # (yellowback-tests.yml `bin-refresh`); a pin older than that is bumped (yewd/PIN).
      - name: download ycashd at the yewd/PIN commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(awk '$1 == "ycash6" {print $2}' yewd/PIN)
          case "$sha" in *[!0-9a-f]*|'') echo "::error::bad ycash6 pin"; exit 1 ;; esac
          [ ${#sha} -eq 40 ] || { echo "::error::bad ycash6 pin"; exit 1; }
          trusted='select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")'
          runs=$(gh run list -R boyfromcave/ycash6 -w yellowback-tests.yml -c "$sha" -L 20 --json databaseId,event,headSha \
            -q ".[] | select(.headSha == \"$sha\") | $trusted | .databaseId")
          got=
          for r in $runs; do
            if gh run download "$r" -R boyfromcave/ycash6 -n node-bin -D "$RUNNER_TEMP/node" 2>/dev/null; then got=$r; break; fi
          done
          if [ -z "$got" ] || [ ! -f "$RUNNER_TEMP/node/node-bin.tgz" ]; then
            echo "::error::no node-bin for ycash6 $sha (expired, or no push/schedule/dispatch run there): bump yewd/PIN to a commit that has one, or dispatch tier bin on its ycash6 branch"
            exit 1
          fi
          exp=$(gh api "repos/boyfromcave/ycash6/actions/runs/$got/artifacts?name=node-bin" -q '.artifacts[0].expires_at' || true)
          if [ -n "$exp" ] && [ "$(date -d "$exp" +%s)" -lt "$(( $(date +%s) + 7 * 86400 ))" ]; then
            echo "::warning::ycash6 node-bin of run $got (yewd/PIN $sha) expires $exp: bump yewd/PIN"
          fi
          tar -xzf "$RUNNER_TEMP/node/node-bin.tgz" -C "$RUNNER_TEMP/node" src/ycashd src/ycash-cli
          tar czf "$RUNNER_TEMP/yewd-node.tgz" -C "$RUNNER_TEMP/node/src" ycashd ycash-cli
          echo "- yewd backend: ycash6 run $got at \`$sha\` (node-bin expires ${exp:-?})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yewd-node
          path: ${{ runner.temp }}/yewd-node.tgz
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
          if-no-files-found: error

  yewd-gates:
    name: yewd gate ${{ matrix.stage }}${{ !matrix.blocking && ' (report-only)' || '' }}
    needs: [yewd-bin, yewd-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Report-only until the stage's exit gate is seen green (kogany plan §3b, coordination handoff
    # §7); the coordinator then sets the entry's `blocking: true`. A report-only stage exits 0 and
    # puts its result in the step summary (a continue-on-error job still shows a red check).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # S0: the backend round trip (facade/tests/regtest.rs), ycashd -regtest -disablewallet behind the façade.
          - {stage: s0-roundtrip, blocking: false}
          - {stage: s1, blocking: false, script: yewd/qa/s1_wallet_reads.py}
          - {stage: s2, blocking: false, script: yewd/qa/s2_wallet_builders.py}
          # S3's attest_agent and cancel_agent stages need YELLOWBACK_ATTEST_BIN (ycash6's agent);
          # they join when this job builds it.
          - {stage: s3-roles, blocking: false, script: yewd/qa/s3_roles.py, args: --stage=roles}
          - {stage: s3-attest_wallet, blocking: false, script: yewd/qa/s3_roles.py, args: --stage=attest_wallet}
          - {stage: s3-attest_bond, blocking: false, script: yewd/qa/s3_roles.py, args: --stage=attest_bond}
          # S4: the two contract suites with every node a pair (backend ycash6 -disablewallet) and the
          # façade leg against a plain ycashd wallet node. Column 3 (kogany behind yewd, S5) is the
          # yewd-parity workflow's nightly.
          - {stage: s4-contract-vault, blocking: false, script: yewd/qa/s4_contract.py, args: --suite=vault}
          - {stage: s4-contract-yellowback, blocking: false, script: yewd/qa/s4_contract.py, args: --suite=yellowback}
          - {stage: s4-facade, blocking: false, script: yewd/qa/s4_facade.py}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: the ycash6 commit yewd/PIN records
        id: pin
        run: |
          sha=$(awk '$1 == "ycash6" {print $2}' yewd/PIN)
          case "$sha" in *[!0-9a-f]*|'') echo "::error::bad ycash6 pin"; exit 1 ;; esac
          echo "ycash6=$sha" >> "$GITHUB_OUTPUT"
      # ycash6's functional framework (qa/rpc-tests, the YEWD_BIN harness) and the contract files
      # (doc/) at the same commit as the ycashd under test.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: matrix.script
        with:
          repository: boyfromcave/ycash6
          ref: ${{ steps.pin.outputs.ycash6 }}
          path: ycash6
          persist-credentials: false
          sparse-checkout: |
            qa
            doc
            contrib/yellowback
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yewd-node
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.script
        with:
          name: yewd-bin
          path: ${{ runner.temp }}
      - name: Unpack
        run: |
          mkdir -p "$RUNNER_TEMP/node" && tar xzf "$RUNNER_TEMP/yewd-node.tgz" -C "$RUNNER_TEMP/node"
          if [ -f "$RUNNER_TEMP/yewd-bin.tgz" ]; then
            mkdir -p "$RUNNER_TEMP/yewd" && tar xzf "$RUNNER_TEMP/yewd-bin.tgz" -C "$RUNNER_TEMP/yewd"
            cat "$RUNNER_TEMP/yewd/yewd-bin.json"
          fi
      # The round trip builds the façade's test (rust-cache keyed as yewd-check's).
      - name: Install protoc
        if: matrix.stage == 's0-roundtrip'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.stage == 's0-roundtrip'
        with:
          workspaces: yewd
          save-if: false
      - name: backend round trip (getblockchaininfo through the façade)
        if: matrix.stage == 's0-roundtrip'
        id: s0
        env:
          YEWD_TEST_REQUIRE_BACKEND: '1'
          BLOCKING: ${{ matrix.blocking }}
        run: |
          rc=0
          YEWD_TEST_YCASHD="$RUNNER_TEMP/node/ycashd" cargo test --manifest-path yewd/Cargo.toml --locked -p yewd-facade --test regtest -- --nocapture || rc=$?
          scripts/report-only.sh "$rc" "$BLOCKING" "yewd gate s0-roundtrip"
      # ycash6's framework: Python 3.11 (asyncore; tomllib), its pinned test packages and the pyblake2
      # shim, as ycash6's yellowback-prereqs action installs them; a C compiler for the Falcon signer.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.script
        with:
          python-version: '3.11'
      - name: ycash6 framework packages
        if: matrix.script
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc libc6-dev
          python3 -m pip install --user -r ycash6/qa/yellowback-ci-requirements.txt
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' 'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
      # The Sapling and Sprout parameters (the signer proves; ycashd loads them), checked against the
      # sums ycash6's zcutil/fetch-params.sh pins. Restore only: no cache is saved from this job.
      - name: restore zcash params
        if: matrix.script
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.zcash-params
          key: zcash-params-8e48ffd2-2f0ebbcb-b685d700
      - name: fetch and verify zcash params
        if: matrix.script
        run: scripts/fetch-zcash-params.sh
      - name: stage gate
        id: gate
        if: matrix.script
        env:
          SCRIPT: ${{ matrix.script }}
          ARGS: ${{ matrix.args }}
          STAGE: ${{ matrix.stage }}
          BLOCKING: ${{ matrix.blocking }}
        run: |
          export YCASH6_QA="$GITHUB_WORKSPACE/ycash6/qa/rpc-tests" ZCASHD="$RUNNER_TEMP/node/ycashd" YEWD_BIN="$RUNNER_TEMP/yewd/yewd"
          mkdir -p "$RUNNER_TEMP/gate"
          read -r -a args <<< "$ARGS"
          rc=0
          python3 -u "$SCRIPT" "${args[@]}" --srcdir="$RUNNER_TEMP/node" --tmpdir="$RUNNER_TEMP/gate/$STAGE" --nocleanup || rc=$?
          scripts/report-only.sh "$rc" "$BLOCKING" "yewd gate $STAGE"
      - name: Upload node and yewd logs on failure
        if: failure() || steps.gate.outputs.failed == 'true' || steps.s0.outputs.failed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yewd-gate-logs-${{ matrix.stage }}
          path: |
            ${{ runner.temp }}/gate/**/node*/regtest/debug.log
            ${{ runner.temp }}/gate/**/node*/yewd.log
          retention-days: 14
          if-no-files-found: warn

  web:
    name: web (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WASM_PACK_VERSION: 0.15.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Exact, as every other input of the release build (the bundle hash depends on the tools).
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      # tsc needs the wasm-bindgen output (src/worker.ts imports ./wasm/yew_web_core.js, which is
      # gitignored), so it runs inside build-release.sh once the module is built, not here.
      - name: shell checks (imports, vitest)
        working-directory: web
        run: npm ci && scripts/check-web-imports.sh && npx vitest run
      - name: Rust toolchain + wasm32 target
        run: rustup show active-toolchain && rustup target add wasm32-unknown-unknown
      # The C half of the module (secp256k1-sys, SQLite in sqlite-wasm-rs) is compiled by this clang,
      # so it is an input of the published bytes like rustc: a versioned package at its exact Ubuntu
      # 24.04 release version (noble, never superseded in that pocket), checked after install. The
      # unversioned `clang` follows the image: ubuntu-latest moving to 26.04 (clang 21) broke the
      # two-build comparison in November 2026. llvm-ar: AR_wasm32_unknown_unknown. protoc:
      # x402-ycash-light's build.rs (generated Rust; its upstream version is checked).
      - name: "Install clang 18.1.3, llvm-ar (wasm32 C: secp256k1-sys, sqlite) and protoc"
        env:
          LLVM_DEB: 1:18.1.3-1ubuntu1
        run: |
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades "clang-18=$LLVM_DEB" "lld-18=$LLVM_DEB" "llvm-18=$LLVM_DEB" protobuf-compiler
          clang-18 --version | tee /dev/stderr | grep -q '^Ubuntu clang version 18\.1\.3 (1ubuntu1)$'
          llvm-ar-18 --version
          protoc --version | tee /dev/stderr | grep -qx 'libprotoc 3\.21\.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web/core-wasm
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: cache wasm-pack
        id: wp
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}
      - name: install wasm-pack
        if: steps.wp.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - name: reproducible release build (twice, compared)
        working-directory: web
        env:
          CC_wasm32_unknown_unknown: clang-18
          AR_wasm32_unknown_unknown: llvm-ar-18
        run: scripts/build-release.sh
      - name: verify the served bundle (sums + SRI)
        working-directory: web
        run: |
          python3 -m http.server 8080 --directory dist >/dev/null 2>&1 &
          sleep 1
          RELEASE_BUNDLE_HASH=$(shasum -a 256 dist/BUNDLE-SHA256SUMS | cut -d' ' -f1) scripts/verify-bundle.sh http://127.0.0.1:8080
      - name: bundle sums (artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yew-web-BUNDLE-SHA256SUMS
          path: web/dist/BUNDLE-SHA256SUMS

  # The kogany leg (report-only until the lead architect flips it: report-only.sh's `false` to `true`). YEW's
  # own build restores rust-cache and saves nothing (zakurad, ycashd, lightwalletd-dd and
  # fetch-params.sh are other repositories' code).
  kogany:
    if: github.ref_name == 'upgrade/vault' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: kogany (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read  # gh run list/download on kogany's and ycash6's runs
    env:
      # kogany upgrade/vault head (the wave gate and its follow-ups merged)
      KOGANY_REF: f12e130befa04a44699ec13b1edcda212526a3a5
      YCASH6_REPO: boyfromcave/ycash6
      # ycash6 upgrade/vault head; moves with the kogany upgrade/vault head (the one ycash6 pin here:
      # node-bin, qa/ and zcutil all come from this commit)
      YCASH6_REF: ce10b3f884716294a46c4c4ce6e43f76a02ed068
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # zakurad-bin.tgz: zakurad (dev profile, --features ycash, ubuntu-24.04, the runner's librocksdb)
      # and zakurad-bin.json, from a push, schedule or dispatch run of kogany at KOGANY_REF only (the
      # contract of the workspace's docs/plans/kogany/ci-design.md), never a pull_request run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: boyfromcave/kogany
          ref: ${{ env.KOGANY_REF }}
          path: kogany
          persist-credentials: false
      # kogany's setup-zakura-build as its script (librocksdb for zakurad). The fallback build fails at
      # dependency resolution until boyfromcave/zakura-common-ycash exists on GitHub (kogany plan K-2).
      - name: kogany build packages
        env:
          INSTALL_LIBCLANG: "false"
          INSTALL_PROTOC: "false"
        run: bash kogany/.github/actions/setup-zakura-build/install-ubuntu-packages.sh
      - name: kogany's zakurad-bin at KOGANY_REF (else built here)
        id: zakurad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$KOGANY_REF" in *[!0-9a-f]*|'') echo "::error::KOGANY_REF is not a commit id"; exit 1 ;; esac
          trusted='select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")'
          runs=$(gh run list -R boyfromcave/kogany -c "$KOGANY_REF" -L 50 --json databaseId,event,headSha \
            -q ".[] | select(.headSha == \"$KOGANY_REF\") | $trusted | .databaseId" 2>/dev/null || true)
          for r in $runs; do
            if gh run download "$r" -R boyfromcave/kogany -n zakurad-bin -D "$RUNNER_TEMP/zk-dl" 2>/dev/null \
               && [ -f "$RUNNER_TEMP/zk-dl/zakurad-bin.tgz" ]; then
              mkdir -p "$RUNNER_TEMP/zk" && tar xzf "$RUNNER_TEMP/zk-dl/zakurad-bin.tgz" -C "$RUNNER_TEMP/zk"
              cat "$RUNNER_TEMP/zk/zakurad-bin.json"
              echo "ZAKURAD=$RUNNER_TEMP/zk/zakurad" >> "$GITHUB_ENV"
              echo "got=true" >> "$GITHUB_OUTPUT"
              echo "zakurad from boyfromcave/kogany run $r"; exit 0
            fi
          done
          echo "got=false" >> "$GITHUB_OUTPUT"
          (cd kogany && CARGO_INCREMENTAL=0 cargo build --locked -p zakura --features ycash --bin zakurad)
          echo "ZAKURAD=$GITHUB_WORKSPACE/kogany/target/debug/zakurad" >> "$GITHUB_ENV"
          echo "no zakurad-bin of boyfromcave/kogany at $KOGANY_REF: building it here"
      - name: zakurad runs here
        run: |
          if ldd "$ZAKURAD" | grep 'not found'; then echo "::error::zakurad needs a library this runner lacks"; exit 1; fi
          "$ZAKURAD" --version
      - name: ycashd from ycash6's node-bin at YCASH6_REF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$YCASH6_REF" in *[!0-9a-f]*|'') echo "::error::YCASH6_REF is not a commit id"; exit 1 ;; esac
          [ ${#YCASH6_REF} -eq 40 ] || { echo "::error::YCASH6_REF is not a full commit id"; exit 1; }
          # a successful push run of yellowback-tests.yml at exactly YCASH6_REF (never a pull_request run)
          runs=$(gh run list -R "$YCASH6_REPO" -c "$YCASH6_REF" -w yellowback-tests.yml -L 20 \
            --json databaseId,conclusion,event,headSha \
            -q ".[] | select(.headSha == \"$YCASH6_REF\" and .event == \"push\" and .conclusion == \"success\") | .databaseId")
          got=
          for r in $runs; do
            if gh run download "$r" -R "$YCASH6_REPO" -n node-bin -D "$RUNNER_TEMP/dl" 2>/dev/null; then
              echo "ycashd from $YCASH6_REPO run $r at $YCASH6_REF"; got=$r; break
            fi
          done
          [ -n "$got" ] || { echo "::error::no node-bin from a successful push run of $YCASH6_REPO at $YCASH6_REF: move YCASH6_REF"; exit 1; }
          mkdir -p "$RUNNER_TEMP/node"
          tar -xzf "$RUNNER_TEMP/dl/node-bin.tgz" -C "$RUNNER_TEMP/node" src/ycashd src/ycash-cli
          test -x "$RUNNER_TEMP/node/src/ycashd"
          echo "YCASHD=$RUNNER_TEMP/node/src/ycashd" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.YCASH6_REPO }}
          ref: ${{ env.YCASH6_REF }}
          path: ycash6
          persist-credentials: false
          sparse-checkout: zcutil
      - name: ycash6 checkout is YCASH6_REF
        run: '[ "$(git -C ycash6 rev-parse HEAD)" = "$YCASH6_REF" ] || { echo "::error::ycash6 checkout is not $YCASH6_REF"; exit 1; }'
      - name: fetch zcash params
        run: ycash6/zcutil/fetch-params.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: lightwalletd-dd at proto/PIN
        run: |
          set -euo pipefail
          rev=$(awk '{print $2}' proto/PIN)
          case "$rev" in *[!0-9a-f]*|'') echo "::error::bad proto/PIN"; exit 1 ;; esac
          git init -q "$RUNNER_TEMP/lwd"
          git -C "$RUNNER_TEMP/lwd" fetch -q --depth 1 https://github.com/boyfromcave/lightwalletd.git "$rev"
          git -C "$RUNNER_TEMP/lwd" checkout -q FETCH_HEAD
          (cd "$RUNNER_TEMP/lwd" && CGO_ENABLED=0 go build -mod=vendor -o "$RUNNER_TEMP/lightwalletd" .)
          echo "LWD_BIN=$RUNNER_TEMP/lightwalletd" >> "$GITHUB_ENV"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler && protoc --version
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: scripts/kogany-leg.sh (report-only)
        env:
          KOGANY_RIG_DIR: ${{ runner.temp }}/kogany-rig
        run: |
          rc=0
          scripts/kogany-leg.sh || rc=$?
          scripts/report-only.sh "$rc" false "kogany leg"
      - name: upload the rig logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yew-kogany-logs
          path: |
            ${{ runner.temp }}/kogany-rig/*.log
            ${{ runner.temp }}/kogany-rig/*.json
          retention-days: 14
          if-no-files-found: ignore
