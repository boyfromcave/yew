# yewd parity nightly (workspace kogany plan §3b S5, §6 "Parity" and "Three-way matrix";
# docs/plans/kogany/ci-design.md §7; yewd/docs: docs/plans/yewd-plan.md §3.5).
#
# Column 3 of the W9 matrix: ycash6's wallet-needing scripts (qa/kogany-mixed-shards.txt, group
# `pair`), unchanged, with every node kogany + yewd and no ycashd behind any node, then the mixed
# variant with one ycash6 peer judging every block and transaction the pairs make. One job per mixed
# group and column (re-run on its own); yewd/qa/s5_parity.py runs the scripts and writes the table.
# The harness (ycash6 qa/rpc-tests/test_framework/kogany.py, YEWD_KOGANY) compares
# vault_getinfo.statehash and yed_getstatehash at every sync point, so a green run is the evidence.
#
# The S5 exit gate's "nightly green for 7 days" is read from this workflow's scheduled run history
# on vaults/kogany-compat. Report-only (continue-on-error) until S5's gate is seen green; the
# coordinator then removes continue-on-error. Columns 1 and 2 are ycash6's own jobs
# (yellowback-tests.yml `functional`, the sidecar nightly).
#
# Inputs, each pinned (ci-design §3): zakurad from kogany's zakurad-bin at KOGANY_REF (else built
# there, which needs boyfromcave/zakura-common-ycash on GitHub, K-2); ycashd from ycash6's node-bin
# at YCASH6_REF; ycash6's qa/ at YCASH6_REF (the YEWD_KOGANY harness); yewd built here.
name: yewd-parity

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: 'rounds per job (2 = "twice in a row")'
        default: '1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # kogany vaults/kogany-compat: every yed_* read live (W7-b), the regtest Falcon height
  KOGANY_REF: eaac2b78d538b67d5862ef2b930809eb822b9b05
  YCASH6_REPO: boyfromcave/ycash6
  # ycash6 vaults/kogany-compat head; moves with the kogany-compat heads (the one ycash6 pin here:
  # node-bin, qa/ and zcutil all come from this commit)
  YCASH6_REF: 91763f656c8e857b41c06b7e632a33344f8a0d0d

jobs:
  parity:
    if: github.ref_name == 'vaults/kogany-compat' || github.event_name == 'workflow_dispatch'
    name: yewd parity ${{ matrix.column }} ${{ matrix.group }} (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    permissions:
      contents: read
      actions: read  # gh run list/download on kogany's and ycash6's runs
    strategy:
      fail-fast: false
      matrix:
        column: [pair, pair-mixed]
        group: [node, vault, yed, fees, attest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler gcc libc6-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: yewd
          key: bin
          save-if: false
      - name: Build yewd and yewd-signer (dev profile)
        run: |
          cargo build --locked --manifest-path yewd/Cargo.toml --bins
          echo "YEWD_BIN=$GITHUB_WORKSPACE/yewd/target/debug/yewd" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.YCASH6_REPO }}
          ref: ${{ env.YCASH6_REF }}
          path: ycash6
          persist-credentials: false
          sparse-checkout: |
            qa
            doc
            contrib/yellowback
            zcutil
          sparse-checkout-cone-mode: true
      - name: ycash6 checkout is YCASH6_REF
        run: '[ "$(git -C ycash6 rev-parse HEAD)" = "$YCASH6_REF" ] || { echo "::error::ycash6 checkout is not $YCASH6_REF"; exit 1; }'
      - name: fetch zcash params
        run: ycash6/zcutil/fetch-params.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: ycash6 framework packages
        run: |
          python3 -m pip install --user -r ycash6/qa/yellowback-ci-requirements.txt
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' 'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: boyfromcave/kogany
          ref: ${{ env.KOGANY_REF }}
          path: kogany
          persist-credentials: false
      - name: kogany build packages
        env:
          INSTALL_LIBCLANG: "false"
          INSTALL_PROTOC: "false"
        run: bash kogany/.github/actions/setup-zakura-build/install-ubuntu-packages.sh
      - name: kogany's zakurad-bin at KOGANY_REF (else built here)
        id: zakurad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trusted='select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")'
          runs=$(gh run list -R boyfromcave/kogany -c "$KOGANY_REF" -L 50 --json databaseId,event,headSha \
            -q ".[] | $trusted | .databaseId" 2>/dev/null || true)
          for r in $runs; do
            if gh run download "$r" -R boyfromcave/kogany -n zakurad-bin -D "$RUNNER_TEMP/zk-dl" 2>/dev/null \
               && [ -f "$RUNNER_TEMP/zk-dl/zakurad-bin.tgz" ]; then
              mkdir -p "$RUNNER_TEMP/zk" && tar xzf "$RUNNER_TEMP/zk-dl/zakurad-bin.tgz" -C "$RUNNER_TEMP/zk"
              echo "ZAKURAD=$RUNNER_TEMP/zk/zakurad" >> "$GITHUB_ENV"
              echo "got=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "got=false" >> "$GITHUB_OUTPUT"
          (cd kogany && CARGO_INCREMENTAL=0 cargo build --locked -p zakura --features ycash --bin zakurad)
          echo "ZAKURAD=$GITHUB_WORKSPACE/kogany/target/debug/zakurad" >> "$GITHUB_ENV"
      - name: ycashd from ycash6's node-bin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$YCASH6_REF" in *[!0-9a-f]*|'') echo "::error::YCASH6_REF is not a commit id"; exit 1 ;; esac
          [ ${#YCASH6_REF} -eq 40 ] || { echo "::error::YCASH6_REF is not a full commit id"; exit 1; }
          # a successful push run of yellowback-tests.yml at exactly YCASH6_REF (never a pull_request run)
          runs=$(gh run list -R "$YCASH6_REPO" -c "$YCASH6_REF" -w yellowback-tests.yml -L 20 \
            --json databaseId,conclusion,event,headSha \
            -q ".[] | select(.headSha == \"$YCASH6_REF\" and .event == \"push\" and .conclusion == \"success\") | .databaseId")
          got=
          for r in $runs; do
            if gh run download "$r" -R "$YCASH6_REPO" -n node-bin -D "$RUNNER_TEMP/dl" 2>/dev/null; then
              echo "ycashd from $YCASH6_REPO run $r at $YCASH6_REF"; got=$r; break
            fi
          done
          [ -n "$got" ] || { echo "::error::no node-bin from a successful push run of $YCASH6_REPO at $YCASH6_REF: move YCASH6_REF"; exit 1; }
          mkdir -p "$RUNNER_TEMP/node"
          tar -xzf "$RUNNER_TEMP/dl/node-bin.tgz" -C "$RUNNER_TEMP/node" src/ycashd src/ycash-cli
          echo "ZCASHD=$RUNNER_TEMP/node/src/ycashd" >> "$GITHUB_ENV"
      - name: s5_parity.py (column ${{ matrix.column }}, group ${{ matrix.group }})
        env:
          COLUMN: ${{ matrix.column }}
          GROUP: ${{ matrix.group }}
          ROUNDS: ${{ inputs.rounds || '1' }}
        run: |
          if ldd "$ZAKURAD" | grep 'not found'; then echo "::error::zakurad needs a library this runner lacks"; exit 1; fi
          YCASH6="$GITHUB_WORKSPACE/ycash6" python3 -u yewd/qa/s5_parity.py --columns "$COLUMN" --of "$GROUP" \
            --rounds "$ROUNDS" --jobs 2 --out "$RUNNER_TEMP/s5"
      - name: the table
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP"/s5/round*/matrix.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: upload the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yewd-parity-${{ matrix.column }}-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/s5/**/*.log
            ${{ runner.temp }}/s5/**/*.jsonl
            ${{ runner.temp }}/s5/**/matrix.*
            ${{ runner.temp }}/s5/**/node*/yewd.log
            ${{ runner.temp }}/s5/**/node*/backend/zakurad.log
          retention-days: 14
          if-no-files-found: warn
