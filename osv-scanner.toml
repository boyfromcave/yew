# OSV-Scanner accepted vulnerabilities (SECURITY-CI.md, "Dependency vulnerabilities"). Each entry has a
# reason a reviewer can check and an ignoreUntil at most 90 days out, so it is re-decided, not forgotten.
# Fixable ones are fixed in the lockfile instead (respecting the exact pins, scripts/check-deps.sh).

[[IgnoredVulns]]
id = "RUSTSEC-2026-0009"
ignoreUntil = 2027-01-21
reason = "time 0.3.37 is held by librustzcash6 zcash_client_backend (time-core =0.1.2); only RFC 2822 parsing is affected and no linked crate uses it. Same decision as scripts/audit-exceptions.txt and docs/security-review.md (Dependency audit)."

[[IgnoredVulns]]
id = "GHSA-r6v5-fh4h-64xc"
ignoreUntil = 2027-01-21
reason = "GitHub alias of RUSTSEC-2026-0009 (time 0.3.37 stack exhaustion in RFC 2822 parsing); see that entry."

[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
ignoreUntil = 2027-01-21
reason = "atomic-polyfill is unmaintained (informational, no vulnerability, no fix). It is in Cargo.lock only through frost-core -> postcard -> heapless 0.7, which no enabled feature builds: `cargo tree --locked --target all -e all -i atomic-polyfill` prints nothing. cargo audit reports it as a non-blocking warning too."

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-25
reason = "Cargo.lock: block-buffer 0.10.4 and 0.11.0-rc.3 under digest (sha2/blake2 in the zcash_* crates and the wallet's own hashing). GHSA-qwgh-2vcv-g2f7 (moderate, GitHub-only, not in the RustSec database cargo-deny reads): a panic caught inside a digest's compress callback can leave block-buffer's cursor out of range, so a later use of the same buffer reads or writes out of bounds. Fixed only in 0.12.1 (the digest 0.11 line); the digest 0.10 line, which every released sha2/sha3/blake2 still uses, has no fixed release. Nothing in yew calls catch_unwind, so a panic inside a compress callback is never caught and the cursor is never reused. Revisit when the RustCrypto hashes ship on digest 0.11."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2026-12-11
reason = "Triaged 2026-11-11, decided by the Yellowback lead architect (accept with changes). libsqlite3-sys 0.37.0 (Cargo.lock, yewd/Cargo.lock; listed but not linked in web/core-wasm/Cargo.lock) bundles SQLite < 3.54.0, CVE-2026-119375: a local attacker who can plant a crafted -wal file (different page size) beside a database the wallet opens can make SQLite return stale process memory, possibly key material. Fix: libsqlite3-sys 0.39, which needs rusqlite 0.41. YEW pins rusqlite =0.39.0 (core/Cargo.toml) and is held there by zcash_client_sqlite 0.20.2 and schemerz-rusqlite from librustzcash6; librustzcash6 is further capped by arti (tor-dirmgr: rusqlite >=0.36,<0.40; newest <0.41), which does not apply to YEW (no tor-*/arti crate in any YEW lockfile). Exposure: yew-<net>.sqlite is made 0600 by Store::open (core/src/store.rs; test file_is_owner_only) and wallet.sqlite sits in shielded/<stem>/, made 0700 (core/src/shielded.rs Shielded::open); planting a -wal needs write access to the wallet's own directory. The browser build links SQLite 3.53.0 from sqlite-wasm-rs 0.5.5 instead (same bug, not fixed by rusqlite 0.41, no scanner flags it); its OPFS sahpool VFS has no shared-memory methods, so SQLite never opens a WAL there (docs/security-review.md Z-14). Upgrade owner: lane SQLITE-UPGRADE (librustzcash6). Short date on purpose; scripts/audit-exceptions.txt."
