[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
ignoreUntil = 2027-01-21
reason = "atomic-polyfill is unmaintained (informational, no vulnerability, no fix). It is in Cargo.lock only through frost-core -> postcard -> heapless 0.7, which no enabled feature builds: `cargo tree --locked --target all -e all -i atomic-polyfill` prints nothing. cargo audit reports it as a non-blocking warning too."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0574"
ignoreUntil = 2027-02-17
reason = "heapless 0.7.17 (unsound APIs in heapless 0.7, fixed only in 0.9.4+): heapless arrives only via frost-core 3.0.0 -> postcard 1.1.3 (default features) and is not compiled (in Cargo.lock, yewd/, web/core-wasm/ and web/spike-* locks only as an optional dependency of reddsa's unused frost feature); no affected API reachable. Accepted by the Yellowback lead architect 2026-11-19; tracked in issue #64."

