[package]
name = "yew-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "YEW core: keys, transactions, Yellowback (YED) payloads, gRPC clients, sync, store, broadcast gate"
build = "build.rs"

[lib]
name = "yew_core"
path = "src/lib.rs"
# rlib for yew-cli and the tests, staticlib for the iOS xcframework (scripts/build-core-ios.sh),
# cdylib for Android jniLibs (scripts/build-core-android.sh); the bridge loads `yew_core`.
crate-type = ["rlib", "staticlib", "cdylib"]

# Allow-list: plan §3.3 only (checked by scripts/check-deps.sh against scripts/allowed-deps.txt).
# tonic 0.14 moved its prost codec into `tonic-prost`; it is counted as part of tonic.
[dependencies]
secp256k1 = { version = "=0.33.1", features = ["recovery", "rand", "std"] }
# `zeroize`: the Mnemonic wipes its word indices on drop (W5 review S-1); the crate is already in
# the tree through rustls, so the allow-list of plan §3.3 is unchanged.
bip39 = { version = "=3.0.0", features = ["rand", "zeroize"] }
hmac = "=0.13.0-pre.4"
# hmac, sha2, ripemd: the RustCrypto pre-releases `bip32 =0.6.0-pre.1` pins exactly (librustzcash6
# zcash_transparent -> bip32; zcash_keys and the x402-ycash/light core both reach it). Cargo cannot
# hold `=0.2.0-pre.4` beside `=0.2.0` in one graph, so YEW takes bip32's versions; the node
# transparent signing vectors (tests/vectors.rs) are the check that nothing changed.
sha2 = "=0.11.0-pre.4"
ripemd = "=0.2.0-pre.4"
blake2b_simd = "=1.0.5"
bs58 = "=0.5.1"
# `tls-webpki-roots` (audit G-4): the Mozilla bundle as a root store beside the platform's
# roots. `rustls-native-certs` has no iOS backend, so without it every TLS connection on iOS
# failed the handshake. `webpki-roots` is pinned here as a direct dependency so its version is
# exact (plan §3.3 allow-list: scripts/allowed-deps.txt).
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "channel", "tls-ring", "tls-native-roots", "tls-webpki-roots"] }
webpki-roots = "=1.0.9"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
# The bridge (api.rs): the crate and flutter_rust_bridge_codegen are the same version (W0a); the
# Dart package in app/pubspec.yaml is pinned to it too.
flutter_rust_bridge = "=2.13.0"
# Sapling key derivation (yew-shielded plan S0-1, `shielded_keys.rs`): ZIP-32 over the BIP39
# seed, the Sapling key types and their Bech32 encodings. `zcash_keys` comes from
# boyfromcave/librustzcash6 (= miodragpop/librustzcash @ ec525fae, the Ycash-aware librustzcash
# ycashd 6.21.0 pins and x402-ycash/light builds on), by path from the workspace checkout beside
# this repo; a release switches it to a git rev. `sapling` feature only. `sapling-crypto` 0.7.0
# and `zip32` 0.2.0 are the versions librustzcash6 locks (named directly for the key types).
zcash_keys = { version = "=0.14.0", path = "../../librustzcash6/zcash_keys", default-features = false, features = ["std", "sapling"] }
sapling-crypto = { version = "=0.7.0", default-features = false, features = ["std"] }
zip32 = { version = "=0.2.0", default-features = false }
# The Ycash Sapling light client (yew-shielded plan S1/S2): compact-block sync from lightwalletd-dd,
# the note store (`zcash_client_sqlite`), reorg handling, broadcast. The library crate of
# `boyfromcave/x402-ycash` (`light/`, crate `x402-ycash-light`, lib `x402_ycash_light`), by path from
# the workspace checkout beside this repo; a release switches it to a git rev of that repository.
x402-ycash-light = { version = "=0.1.0", path = "../../x402-ycash/light" }
# The shielded spend path and the note store, read beside the light client (`core/src/shielded.rs`):
# the light library syncs, YEW proposes/proves/signs (privacy-first funding, transparent recipients,
# memos, the fee preview) and fetches memos (`decrypt_and_store_transaction`) itself, on the same
# `zcash_client_sqlite` database. All from boyfromcave/librustzcash6 by path, at the versions the
# light library locks; no feature beyond what it already enables. `rand` (0.8, `OsRng`) is the RNG
# type `WalletDb` is generic over, already in the graph through the same crates.
zcash_client_backend = { version = "=0.22.0", path = "../../librustzcash6/zcash_client_backend", default-features = false }
zcash_client_sqlite = { version = "=0.20.2", path = "../../librustzcash6/zcash_client_sqlite", default-features = false }
zcash_primitives = { version = "=0.28.0", path = "../../librustzcash6/zcash_primitives", default-features = false, features = ["std"] }
zcash_proofs = { version = "=0.28.0", path = "../../librustzcash6/zcash_proofs", default-features = false, features = ["local-prover"] }
zcash_protocol = { version = "=0.9.0", path = "../../librustzcash6/components/zcash_protocol", default-features = false, features = ["std"] }
rand = { version = "=0.8.8", default-features = false, features = ["std", "std_rng", "getrandom"] }
# The Sapling proving parameters are downloaded over HTTPS on first shielded send (S0-2,
# `core/src/sapling_params.rs`): rustls through `tokio-rustls` (the version tonic's TLS already
# links) with the Mozilla roots above; the SHA-256 pins, not the transport, are the integrity check.
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }

# flutter_rust_bridge's macros test `cfg(frb_expand)`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[build-dependencies]
tonic-prost-build = "=0.14.6"
prost-build = "=0.14.4"
