[package]
name = "yew-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "YEW core: keys, transactions, Yellowback (YED) payloads, gRPC clients, sync, store, broadcast gate"
build = "build.rs"

[lib]
name = "yew_core"
path = "src/lib.rs"
# rlib for yew-cli and the tests, staticlib for the iOS xcframework (scripts/build-core-ios.sh),
# cdylib for Android jniLibs (scripts/build-core-android.sh); the bridge loads `yew_core`.
crate-type = ["rlib", "staticlib", "cdylib"]

# Allow-list: plan §3.3 only (checked by scripts/check-deps.sh against scripts/allowed-deps.txt).
# tonic 0.14 moved its prost codec into `tonic-prost`; it is counted as part of tonic.
[dependencies]
secp256k1 = { version = "=0.33.1", features = ["recovery", "rand", "std"] }
# `zeroize`: the Mnemonic wipes its word indices on drop (W5 review S-1); the crate is already in
# the tree through rustls, so the allow-list of plan §3.3 is unchanged.
bip39 = { version = "=3.0.0", features = ["rand", "zeroize"] }
hmac = "=0.13.0-pre.4"
# hmac, sha2, ripemd: the RustCrypto pre-releases `bip32 =0.6.0-pre.1` pins exactly (librustzcash6
# zcash_transparent -> bip32; zcash_keys and the x402-ycash/light core both reach it). Cargo cannot
# hold `=0.2.0-pre.4` beside `=0.2.0` in one graph, so YEW takes bip32's versions; the node
# transparent signing vectors (tests/vectors.rs) are the check that nothing changed.
sha2 = "=0.11.0-pre.4"
ripemd = "=0.2.0-pre.4"
blake2b_simd = "=1.0.5"
bs58 = "=0.5.1"
# `tls-webpki-roots` (audit G-4): the Mozilla bundle as a root store beside the platform's
# roots. `rustls-native-certs` has no iOS backend, so without it every TLS connection on iOS
# failed the handshake. `webpki-roots` is pinned here as a direct dependency so its version is
# exact (plan §3.3 allow-list: scripts/allowed-deps.txt).
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "channel", "tls-ring", "tls-native-roots", "tls-webpki-roots"] }
webpki-roots = "=1.0.9"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
# The bridge (api.rs): the crate and flutter_rust_bridge_codegen are the same version (W0a); the
# Dart package in app/pubspec.yaml is pinned to it too.
flutter_rust_bridge = "=2.13.0"
# Sapling key derivation (yew-shielded plan S0-1, `shielded_keys.rs`): ZIP-32 over the BIP39
# seed, the Sapling key types and their Bech32 encodings. `zcash_keys` comes from
# boyfromcave/librustzcash6 by git rev: 4867cf85 = miodragpop/librustzcash @ ec525fae (the
# Ycash-aware librustzcash ycashd 6.21.0 pins) plus the vault network upgrade (`BranchId::Vault`
# = 0x6d5b7a31, the revision ycash6 `upgrade/vault` and x402-ycash/light `upgrade/vault` pin;
# upgrade plan §15 finding 58). One source and revision for every `zcash_*` crate below and
# in the light library, so Cargo unifies them. `sapling` feature only. `sapling-crypto` 0.7.0
# and `zip32` 0.2.0 are the versions librustzcash6 locks (named directly for the key types).
zcash_keys = { version = "=0.14.0", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", default-features = false, features = ["std", "sapling"] }
sapling-crypto = { version = "=0.7.0", default-features = false, features = ["std"] }
zip32 = { version = "=0.2.0", default-features = false }
# The Ycash Sapling light client (yew-shielded plan S1/S2): compact-block sync from lightwalletd-dd,
# the note store (`zcash_client_sqlite`), reorg handling, broadcast. The library crate of
# `boyfromcave/x402-ycash` (`light/`, crate `x402-ycash-light`, lib `x402_ycash_light`), by git rev
# of its `upgrade/vault` branch (8daa6fb: the light library on librustzcash6 4867cf85, regtest
# `vault=<h>`, signing the next block's branch from `GetChainInfo`). Git, not a path: the build
# does not depend on the workspace layout, and CI resolves the same source as Cargo.lock.
x402-ycash-light = { version = "=0.1.0", git = "https://github.com/boyfromcave/x402-ycash.git", rev = "8daa6fbba5479a684b2ca483b4cac51aea12a89a" }
# The shielded spend path and the note store, read beside the light client (`core/src/shielded.rs`):
# the light library syncs, YEW proposes/proves/signs (privacy-first funding, transparent recipients,
# memos, the fee preview) and fetches memos (`decrypt_and_store_transaction`) itself, on the same
# `zcash_client_sqlite` database. All from boyfromcave/librustzcash6 at the rev above, the versions the
# light library locks; no feature beyond what it already enables. `rand` (0.8, `OsRng`) is the RNG
# type `WalletDb` is generic over, already in the graph through the same crates.
zcash_client_backend = { version = "=0.22.0", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", default-features = false }
zcash_client_sqlite = { version = "=0.20.2", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", default-features = false }
# `transparent-inputs` (yew-shielded plan S4, `shielded::Shielded::build_shield`): the builder
# spends YEW's transparent `YEC` coins into a Sapling output to the wallet's own `ys1…` address
# (shield). YEW still selects the coins (`coins::select_yec`, never the reserve, never a token)
# and the gate checks them; the builder computes the ZIP-243 sighash over the Sapling bundle and
# signs the transparent inputs with the keys YEW hands it for that one call.
zcash_primitives = { version = "=0.28.0", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", default-features = false, features = ["std", "transparent-inputs"] }
# The transparent types the builder takes (outpoint, coin, address, signing set), same crate
# librustzcash6 already links (no new crate in Cargo.lock).
zcash_transparent = { version = "=0.8.0", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", default-features = false, features = ["std", "transparent-inputs"] }
# The secp256k1 the librustzcash6 builder signs with (0.29.1, already in Cargo.lock through
# bip32), renamed: YEW's own signer stays on secp256k1 0.33.1 above. Used only to hand the
# builder the keys of the selected coins (S4 shield).
secp256k1_zcash = { package = "secp256k1", version = "=0.29.1", default-features = false, features = ["alloc"] }
zcash_proofs = { version = "=0.28.0", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", default-features = false, features = ["local-prover"] }
zcash_protocol = { version = "=0.9.0", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", default-features = false, features = ["std"] }
rand = { version = "=0.8.8", default-features = false, features = ["std", "std_rng", "getrandom"] }
# The Sapling proving parameters are downloaded over HTTPS on first shielded send (S0-2,
# `core/src/sapling_params.rs`): rustls through `tokio-rustls` (the version tonic's TLS already
# links) with the Mozilla roots above; the SHA-256 pins, not the transport, are the integrity check.
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }

# flutter_rust_bridge's macros test `cfg(frb_expand)`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[build-dependencies]
tonic-prost-build = "=0.14.6"
prost-build = "=0.14.4"
