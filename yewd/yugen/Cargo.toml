# The Yugen wallet of yewd (beta4 Yugen addendum §3.2, milestone M1). Its own Cargo workspace:
# the two proof systems' vendored crates (leanVM, Binius64) and their toolchain never enter
# yewd's lock. The proof and specification repositories come by path from deps/, checked out
# at the commits in PINS by scripts/deps.sh (decision Y-W1, docs/decisions.md).
[workspace]
resolver = "2"
members = ["wallet"]
exclude = ["deps"]

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3

# yugen-ref takes yugen-falcon by git rev; proof-a takes it by path. One copy: the pinned checkout.
[patch."https://github.com/boyfromcave/yugen-falcon.git"]
yugen-falcon = { path = "deps/yugen-falcon" }
yugen-fn-dsa-kgen = { path = "deps/yugen-falcon/vendor/yugen-fn-dsa-kgen" }
yugen-fn-dsa-sign = { path = "deps/yugen-falcon/vendor/yugen-fn-dsa-sign" }
