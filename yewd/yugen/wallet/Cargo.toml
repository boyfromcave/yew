[package]
name = "yewd-yugen"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "yewd's Yugen wallet: keys, transfer builder, both wallet provers, chain scan (local only)"

[features]
default = ["provers"]
# The two mode-0 wallet provers and their verifiers (yugen-proof-a, yugen-proof-b2).
provers = ["dep:yugen-proof-a", "dep:yugen-proof-b2", "dep:verifier_e2", "dep:binius-core", "dep:binius-frontend"]

[dependencies]
libc = "0.2"
yugen-ref = { path = "../deps/yugen-spec/yugen-ref" }
yugen-proof-a = { path = "../deps/yugen-proof-a", optional = true }
verifier_e2 = { path = "../deps/yugen-proof-a/vendor/leanMultisig/crates/e2/verifier", optional = true }
# Decision Y-W3b: the consensus build (`cat1t`, `blake3`: category 1 mixed field, BLAKE3 Merkle), the
# build the bundler links for System B. Default features stay on: the
# leaf-only build (no `recursion`) does not compile at 2b0cb46 (src/phased.rs uses crate::fold).
yugen-proof-b2 = { path = "../deps/yugen-proof-b2", optional = true, features = ["cat1t", "blake3"] }
binius-core = { path = "../deps/yugen-proof-b2/vendor/binius64/crates/core", optional = true }
binius-frontend = { path = "../deps/yugen-proof-b2/vendor/binius64/crates/frontend", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake2b_simd = "1"
secp256k1 = { version = "0.29", features = ["global-context"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"
