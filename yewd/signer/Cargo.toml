[package]
name = "yewd-signer"
description = "yewd: the signer process — keys, sign-once records, the attestation guard (K-24); S1 the keystore and the public bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yewd_signer"
path = "src/lib.rs"

[[bin]]
name = "yewd-signer"
path = "src/main.rs"

[dependencies]
yewd-proto = { path = "../proto" }
yew-core.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
libc.workspace = true
secp256k1 = { workspace = true, features = ["recovery"] }
# the encrypted store (S4): ChaCha20-Poly1305 and PBKDF2-HMAC-SHA256, at the versions the lock holds
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true
# the Sapling build (S4, F-S2-8): librustzcash6's builder and prover at the revisions yew-core locks
zcash_primitives = { workspace = true, features = ["transparent-inputs", "circuits"] }
zcash_protocol.workspace = true
zcash_keys.workspace = true
zcash_transparent = { version = "=0.8.0", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "6ff87bc9f564fcb7891e1f32698c7ad91ba85ca2", default-features = false, features = ["std", "transparent-inputs"] }
zcash_proofs = { version = "=0.28.0", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "6ff87bc9f564fcb7891e1f32698c7ad91ba85ca2", default-features = false, features = ["local-prover"] }
sapling-crypto.workspace = true
# the scalar types of the Sapling prover traits (a transparent-only build's prover: sapling.rs)
jubjub = { version = "=0.10.0", default-features = false }
bls12_381 = { version = "=0.8.0", default-features = false }
zip32.workspace = true
incrementalmerkletree = "=0.8.2"
orchard = { version = "=0.14.0", default-features = false }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
secp256k1_029 = { package = "secp256k1", version = "=0.29.1" }
